trigger:
  branches:
    include:
    - main
    - features*

pool:
  name: Azurecicd

variables:
- group: dev

stages:

# ============================================================
# CI - Terraform Init
# ============================================================

- stage: CI
  displayName: 'Terraform CI'

  jobs:

  - job: Init
    displayName: 'Terraform Init'

    steps:

    - checkout: self

    # -----------------------------
    # Install Terraform
    # -----------------------------
    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    # -----------------------------
    # Terraform Init
    # -----------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'

        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(resource_group_name)'
        backendAzureRmStorageAccountName: '$(storage_account_name)'
        backendAzureRmContainerName: '$(container_name)'
        backendAzureRmKey: '$(key)'

# ============================================================
# VALIDATE
# ============================================================

- stage: Validate
  displayName: 'Terraform Validate'
  dependsOn: CI

  jobs:

  - job: ValidateJob
    displayName: 'Terraform Validate'

    steps:

    - checkout: self

    # -----------------------------
    # Install Terraform
    # -----------------------------
    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    # -----------------------------
    # Terraform Init
    # Each job has its own workspace
    # -----------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init for Validate'
      inputs:
        provider: 'azurerm'
        command: 'init'

        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(resource_group_name)'
        backendAzureRmStorageAccountName: '$(storage_account_name)'
        backendAzureRmContainerName: '$(container_name)'
        backendAzureRmKey: '$(key)'

    # -----------------------------
    # Terraform Validate
    # -----------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'

# ============================================================
# PLAN
# ============================================================

- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Validate

  jobs:

  - job: PlanJob
    displayName: 'Terraform Plan'

    steps:

    - checkout: self

    # -----------------------------
    # Install Terraform
    # -----------------------------
    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    # -----------------------------
    # Terraform Init
    # -----------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init for Plan'
      inputs:
        provider: 'azurerm'
        command: 'init'

        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(resource_group_name)'
        backendAzureRmStorageAccountName: '$(storage_account_name)'
        backendAzureRmContainerName: '$(container_name)'
        backendAzureRmKey: '$(key)'

    # -----------------------------
    # Terraform Plan
    # -----------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: '$(TF_SERVICE_CONNECTION)'

# ============================================================
# APPLY
# ============================================================

- stage: CD
  displayName: 'Terraform Apply'
  dependsOn: Plan

  jobs:

  - job: ApplyJob
    displayName: 'Terraform Apply'

    steps:

    - checkout: self

    # -----------------------------
    # Install Terraform
    # -----------------------------
    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: '$(TF_VERSION)'

    # -----------------------------
    # Terraform Init
    # -----------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init for Apply'
      inputs:
        provider: 'azurerm'
        command: 'init'

        backendServiceArm: '$(TF_SERVICE_CONNECTION)'
        backendAzureRmResourceGroupName: '$(resource_group_name)'
        backendAzureRmStorageAccountName: '$(storage_account_name)'
        backendAzureRmContainerName: '$(container_name)'
        backendAzureRmKey: '$(key)'

    # -----------------------------
    # Terraform Apply
    # -----------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: '$(TF_SERVICE_CONNECTION)'