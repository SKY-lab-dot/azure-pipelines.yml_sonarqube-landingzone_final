trigger:
- main

pool:
  name: Azurecicd

stages:

# =========================================================
# TERRAFORM PIPELINE
# =========================================================

- stage: Terraform
  displayName: 'Terraform Pipeline'

  jobs:

  # =======================================================
  # 1. TERRAFORM INIT
  # =======================================================

  - job: Init
    displayName: 'Terraform Init'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'


  # =======================================================
  # 2. TERRAFORM VALIDATE
  # =======================================================

  - job: Validate
    displayName: 'Terraform Validate'
    dependsOn: Init

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init for Validate'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'


  # =======================================================
  # 3. TERRAFORM PLAN
  # =======================================================

  - job: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init for Plan'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'shailesh'


  # =======================================================
  # 4. TERRAFORM APPLY
  # =======================================================

  - job: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Terraform Install'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Terraform Init for Apply'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    - task: TerraformTask@5
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'shailesh'