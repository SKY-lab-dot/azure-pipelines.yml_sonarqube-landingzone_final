trigger:
- main

pool:
  name: Azurecicd

stages:

# =========================
# FRONTEND VM
# =========================
- stage: Deploy_Frontend
  displayName: Deploy Frontend VM

  jobs:
  - job: Frontend
    displayName: Deploy to Front VM

    steps:
    - checkout: self

    - task: CopyFilesOverSSH@0
      displayName: Copy files to Front VM
      inputs:
        sshEndpoint: 'frontvm'
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: |
          **/*
          !.git/**
          !.terraform/**
        targetFolder: '/tmp/frontend'
        overwrite: true

    - task: SSH@0
      displayName: Deploy Frontend
      inputs:
        sshEndpoint: 'frontvm'
        runOptions: 'inline'
        inline: |
          sudo mkdir -p /var/www/frontend
          sudo cp -r /tmp/frontend/* /var/www/frontend/
          sudo chown -R www-data:www-data /var/www/frontend
          sudo systemctl restart nginx


# =========================
# BACKEND VM
# =========================
- stage: Deploy_Backend
  displayName: Deploy Backend VM
  dependsOn: Deploy_Frontend

  jobs:
  - job: Backend
    displayName: Deploy to Backend VM

    steps:
    - checkout: self

    - task: CopyFilesOverSSH@0
      displayName: Copy files to Backend VM
      inputs:
        sshEndpoint: 'backendvm'
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: |
          **/*
          !.git/**
          !.terraform/**
        targetFolder: '/tmp/backend'
        overwrite: true

    - task: SSH@0
      displayName: Deploy Backend
      inputs:
        sshEndpoint: 'backendvm'
        runOptions: 'inline'
        inline: |
          sudo mkdir -p /var/www/backend
          sudo cp -r /tmp/backend/* /var/www/backend/
          sudo chown -R www-data:www-data /var/www/backend
          sudo systemctl restart nginx