trigger:
  branches:
    include:
      - main

pool:
  name: Azurecicd

variables:
  nodeVersion: '20.x'
  artifactName: 'streamflix-build'
  deployPath: '/var/www/streamflix'

stages:

# =========================================================
# BUILD STAGE
# =========================================================

- stage: Build
  displayName: 'Build StreamFlix'

  jobs:
  - job: Build
    displayName: 'Build React Application'

    steps:

    # Install Node.js
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    # Check Node/npm
    - script: |
        node --version
        npm --version
      displayName: 'Check Node and npm'

    # Install dependencies
    - script: |
        npm install
      displayName: 'Install Dependencies'

    # Build Vite React application
    - script: |
        npm run build
      displayName: 'Build React Application'

    # Verify dist folder
    - script: |
        if not exist dist (
          echo dist folder not found
          exit /b 1
        )

        echo StreamFlix build successful
        dir dist
      displayName: 'Verify Build'

    # Publish Vite dist folder
    - task: PublishBuildArtifacts@1
      displayName: 'Publish StreamFlix Artifact'
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: '$(artifactName)'
        publishLocation: 'Container'


# =========================================================
# DEPLOY STAGE
# =========================================================

- stage: Deploy
  displayName: 'Deploy StreamFlix Frontend'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy Frontend to Nginx'

    steps:

    # Download artifact
    - task: DownloadBuildArtifacts@1
      displayName: 'Download StreamFlix Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: '$(artifactName)'
        downloadPath: '$(Pipeline.Workspace)'

    # Copy frontend to Nginx VM
    - task: CopyFilesOverSSH@0
      displayName: 'Copy StreamFlix to Nginx'
      inputs:
        sshEndpoint: 'VM1'
        sourceFolder: '$(Pipeline.Workspace)/$(artifactName)'
        contents: '**'
        targetFolder: '$(deployPath)'
        cleanTargetFolder: true
        overwrite: true

    # Restart Nginx
    - task: SSH@0
      displayName: 'Restart Nginx'
      inputs:
        sshEndpoint: 'VM1'
        runOptions: 'inline'
        inline: |
          sudo systemctl restart nginx
          sudo systemctl status nginx --no-pager