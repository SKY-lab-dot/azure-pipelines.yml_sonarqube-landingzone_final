trigger:
  branches:
    include:
      - main

pool:
  name: Azurecicd

variables:
  nodeVersion: '20.x'
  artifactName: 'streamflix-build'
  deployPath: '/var/www/streamflix'

stages:

# =========================================================
# BUILD STAGE
# =========================================================

- stage: Build
  displayName: 'Build StreamFlix'

  jobs:
  - job: Build
    displayName: 'Build React Application'

    steps:

    # Clone StreamFlix GitHub repository
    - powershell: |
        Set-Location "$(Build.SourcesDirectory)"

        Write-Host "Cleaning source directory..."

        Get-ChildItem -Force |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

        Write-Host "Cloning StreamFlix..."

        git clone --branch main --single-branch `
          https://github.com/SKY-lab-dot/StreamFlix.git .

        Write-Host "Repository cloned."
        git log -1 --oneline

        Write-Host "Checking package.json..."

        if (!(Test-Path "$(Build.SourcesDirectory)\package.json")) {
          Write-Error "package.json not found!"
          exit 1
        }

        Write-Host "package.json found."
      displayName: 'Clone StreamFlix'

    # Install Node.js
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    # Check Node/npm
    - script: |
        node --version
        npm --version
      displayName: 'Check Node and npm'

    # Install dependencies
    - script: |
        npm install
      displayName: 'Install Dependencies'

    # Build Vite React application
    - script: |
        npm run build
      displayName: 'Build React Application'

    # Verify dist
    - powershell: |
        if (!(Test-Path "$(Build.SourcesDirectory)\dist")) {
          Write-Error "dist folder was not created."
          exit 1
        }

        Write-Host "StreamFlix build successful."
        Get-ChildItem "$(Build.SourcesDirectory)\dist"
      displayName: 'Verify Build'

    # Publish dist
    - task: PublishBuildArtifacts@1
      displayName: 'Publish StreamFlix Artifact'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)\dist'
        ArtifactName: '$(artifactName)'
        publishLocation: 'Container'

# =========================================================
# DEPLOY STAGE
# =========================================================

- stage: Deploy
  displayName: 'Deploy StreamFlix Frontend'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy Frontend to Nginx'

    steps:

    # Download artifact
    - task: DownloadBuildArtifacts@1
      displayName: 'Download StreamFlix Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: '$(artifactName)'
        downloadPath: '$(Pipeline.Workspace)'

    # Copy frontend to Nginx VM
    - task: CopyFilesOverSSH@0
      displayName: 'Copy StreamFlix to Nginx'
      inputs:
        sshEndpoint: 'VM1'
        sourceFolder: '$(Pipeline.Workspace)/$(artifactName)'
        contents: '**'
        targetFolder: '$(deployPath)'
        cleanTargetFolder: true
        overwrite: true

    # Restart Nginx
    - task: SSH@0
      displayName: 'Restart Nginx'
      inputs:
        sshEndpoint: 'VM1'
        runOptions: 'inline'
        inline: |
          sudo systemctl restart nginx
          sudo systemctl status nginx --no-pager