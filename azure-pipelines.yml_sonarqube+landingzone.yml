trigger:
- main

pool:
  name: Azurecicd

variables:
- group: dev

stages:

# =====================================================
# TERRAFORM
# =====================================================

- stage: Terraform
  displayName: 'Terraform Init and Validate'

  jobs:

  - job: TerraformJob
    displayName: 'Terraform'

    steps:

    # -------------------------------------------------
    # CHECKOUT
    # -------------------------------------------------

    - checkout: self
      clean: true

    # -------------------------------------------------
    # INSTALL TERRAFORM
    # -------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform 1.16.5'
      inputs:
        terraformVersion: '1.16.5'

    # -------------------------------------------------
    # DEBUG TERRAFORM
    # -------------------------------------------------

    - powershell: |
        Write-Host "========================================"
        Write-Host "Agent Information"
        Write-Host "========================================"

        Write-Host "Agent.ToolsDirectory = $(Agent.ToolsDirectory)"
        Write-Host "Agent.WorkFolder = $(Agent.WorkFolder)"
        Write-Host "Build.SourcesDirectory = $(Build.SourcesDirectory)"

        Write-Host ""
        Write-Host "Running user:"
        whoami

        Write-Host ""
        Write-Host "========================================"
        Write-Host "Terraform Information"
        Write-Host "========================================"

        $tf = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

        Write-Host "Terraform path:"
        Write-Host $tf

        Write-Host ""
        Write-Host "Checking Terraform file..."

        if (Test-Path -LiteralPath $tf) {
            Write-Host "Terraform file EXISTS"
        }
        else {
            Write-Error "Terraform file NOT FOUND"
            exit 1
        }

        Write-Host ""
        Write-Host "Terraform version:"

        & $tf version

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform version command failed"
            exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "Repository files:"
        Get-ChildItem "$(Build.SourcesDirectory)"

        Write-Host ""
        Write-Host "Terraform files:"
        Get-ChildItem "$(Build.SourcesDirectory)" -Filter "*.tf"

      displayName: 'Debug Terraform Executable'

    # -------------------------------------------------
    # TERRAFORM INIT
    # -------------------------------------------------

    - powershell: |
        Write-Host "========================================"
        Write-Host "Terraform Init"
        Write-Host "========================================"

        $terraform = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

        Write-Host "Terraform executable:"
        Write-Host $terraform

        if (!(Test-Path -LiteralPath $terraform)) {
            Write-Error "Terraform executable not found"
            exit 1
        }

        Write-Host ""
        Write-Host "Working directory:"
        Get-Location

        Write-Host ""
        Write-Host "Terraform files:"
        Get-ChildItem -Filter "*.tf"

        Write-Host ""
        Write-Host "Running Terraform Init..."

        & $terraform init `
          "-backend-config=storage_account_name=sitterraformstate2026" `
          "-backend-config=container_name=tfstate" `
          "-backend-config=key=sit.terraform.tfstate" `
          "-backend-config=resource_group_name=sit" `
          "-backend-config=subscription_id=6670366d-32db-4180-a842-1ce1053317b7" `
          "-backend-config=use_azuread_auth=true"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "Terraform Init SUCCESS"

      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: 'Terraform Init - Direct PowerShell'

    # -------------------------------------------------
    # TERRAFORM VALIDATE
    # -------------------------------------------------

    - powershell: |
        Write-Host "========================================"
        Write-Host "Terraform Validate"
        Write-Host "========================================"

        $terraform = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

        Write-Host "Running Terraform Validate..."

        & $terraform validate

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform validate failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "Terraform Validate SUCCESS"

      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: 'Terraform Validate'

