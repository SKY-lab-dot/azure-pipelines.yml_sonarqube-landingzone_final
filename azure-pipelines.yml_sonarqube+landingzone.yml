# ============================================================
# TERRAFORM LANDING ZONE CI/CD PIPELINE
# TFLint + tfsec + SonarQube + Terraform Validate + Plan + Apply
# ============================================================

trigger:
- main

pool:
  name: Azurecicd

variables:
- group: dev

# ============================================================
# STAGE 1 - SECURITY + VALIDATION
# ============================================================

stages:

- stage: Security_Validation
  displayName: 'Security, Lint and Terraform Validation'

  jobs:

  - job: Security
    displayName: 'TFLint, tfsec, SonarQube and Terraform Validate'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      clean: true

    # --------------------------------------------------------
    # FIND TERRAFORM ROOT
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Finding Terraform Root"
        Write-Host "========================================"

        $source = "$(Build.SourcesDirectory)"

        Write-Host "Build Sources Directory:"
        Write-Host $source

        Write-Host ""
        Write-Host "Searching for Terraform files..."

        $mainFiles = Get-ChildItem `
          -Path $source `
          -Recurse `
          -Filter "main.tf" `
          -File `
          -ErrorAction SilentlyContinue

        if ($mainFiles.Count -eq 0) {
            Write-Error "main.tf was not found anywhere inside repository."
            Write-Host ""
            Write-Host "Repository contents:"
            Get-ChildItem $source -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName
            exit 1
        }

        $terraformRoot = $null

        foreach ($file in $mainFiles) {

            $dir = $file.Directory.FullName

            $provider = Join-Path $dir "provider.tf"

            if (Test-Path -LiteralPath $provider) {
                $terraformRoot = $dir
                break
            }
        }

        if ([string]::IsNullOrWhiteSpace($terraformRoot)) {
            Write-Error "Could not find directory containing both main.tf and provider.tf."
            exit 1
        }

        Write-Host ""
        Write-Host "========================================"
        Write-Host "Terraform Root Found"
        Write-Host "========================================"

        Write-Host $terraformRoot

        Write-Host ""
        Write-Host "Terraform files:"

        Get-ChildItem $terraformRoot -Filter "*.tf" |
          Select-Object Name, FullName

        Write-Host ""
        Write-Host "##vso[task.setvariable variable=TerraformRoot]$terraformRoot"

      displayName: 'Find Terraform Root'

    # --------------------------------------------------------
    # TERRAFORM INSTALLER
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform 1.16.5'
      inputs:
        terraformVersion: '1.16.5'

    # --------------------------------------------------------
    # TERRAFORM VERSION CHECK
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Terraform Version"
        Write-Host "========================================"

        Write-Host "Terraform Root:"
        Write-Host "$(TerraformRoot)"

        $terraform = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

        if (!(Test-Path -LiteralPath $terraform)) {
            Write-Error "Terraform executable not found:"
            Write-Error $terraform
            exit 1
        }

        & $terraform version

        if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
        }

      displayName: 'Terraform Version'

    # ========================================================
    # TFLINT
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "========================================"
        Write-Host "TFLint"
        Write-Host "========================================"

        Write-Host "Terraform Root:"
        Write-Host "$(TerraformRoot)"

        $version = "0.59.1"

        $zip = "$(Agent.TempDirectory)\tflint.zip"
        $extract = "$(Agent.TempDirectory)\tflint"

        if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
        }

        New-Item `
          -ItemType Directory `
          -Path $extract `
          -Force | Out-Null

        $url = "https://github.com/terraform-linters/tflint/releases/download/v$version/tflint_windows_amd64.zip"

        Write-Host "Downloading TFLint..."

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $zip

        Expand-Archive `
          -Path $zip `
          -DestinationPath $extract `
          -Force

        $tflint = Join-Path $extract "tflint.exe"

        if (!(Test-Path -LiteralPath $tflint)) {
            Write-Error "TFLint executable not found."
            exit 1
        }

        & $tflint --version

        # Move to actual Terraform root
        Set-Location "$(TerraformRoot)"

        Write-Host ""
        Write-Host "Running TFLint initialization..."

        & $tflint --init

        if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint initialization failed."
            exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "Running TFLint..."

        & $tflint

        if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint found issues."
            exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "TFLint SUCCESS"

      displayName: 'TFLint Security Check'

    # ========================================================
    # TFSEC
    # ========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "========================================"
        Write-Host "tfsec"
        Write-Host "========================================"

        Write-Host "Terraform Root:"
        Write-Host "$(TerraformRoot)"

        $version = "1.28.14"

        $extract = "$(Agent.TempDirectory)\tfsec"

        if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
        }

        New-Item `
          -ItemType Directory `
          -Path $extract `
          -Force | Out-Null

        $tfsec = Join-Path $extract "tfsec.exe"

        $url = "https://github.com/aquasecurity/tfsec/releases/download/v$version/tfsec-windows-amd64.exe"

        Write-Host "Downloading tfsec..."

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $tfsec

        if (!(Test-Path -LiteralPath $tfsec)) {
            Write-Error "tfsec executable not found."
            exit 1
        }

        & $tfsec --version

        Write-Host ""
        Write-Host "Running tfsec..."

        $resultFile = "$(Build.ArtifactStagingDirectory)\tfsec-results.xml"

        & $tfsec "$(TerraformRoot)" `
          --format junit `
          --out "$resultFile"

        $tfsecExit = $LASTEXITCODE

        if (Test-Path -LiteralPath $resultFile) {

            Write-Host ""
            Write-Host "tfsec JUnit report created:"
            Write-Host $resultFile
        }

        Write-Host ""
        Write-Host "tfsec completed with exit code: $tfsecExit"

        # Security findings do not fail pipeline.
        exit 0

      displayName: 'tfsec Security Scan'

    # --------------------------------------------------------
    # PUBLISH TFSEC RESULTS
    # --------------------------------------------------------

    - task: PublishTestResults@2
      displayName: 'Publish tfsec Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Build.ArtifactStagingDirectory)\tfsec-results.xml'
        failTaskOnFailedTests: false
        testRunTitle: 'tfsec Security Scan'

    # ========================================================
    # SONARQUBE PREPARE
    # ========================================================

    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'SonarQube-Connection'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'terraform-landing-zone'
        cliProjectName: 'Terraform Landing Zone'
        cliSources: '$(TerraformRoot)'

    # ========================================================
    # SONARQUBE ANALYZE
    # ========================================================

    - task: SonarQubeAnalyze@7
      displayName: 'Run SonarQube Analysis'

    # ========================================================
    # SONARQUBE PUBLISH
    # ========================================================

    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

    # ========================================================
    # TERRAFORM INIT
    # ========================================================

    - powershell: |

        Write-Host "========================================"
        Write-Host "Terraform Init"
        Write-Host "========================================"

        Write-Host "Terraform Root:"
        Write-Host "$(TerraformRoot)"

        Set-Location "$(TerraformRoot)"

        Write-Host ""
        Write-Host "Current directory:"
        Get-Location

        Write-Host ""
        Write-Host "Terraform files:"
        Get-ChildItem -Filter "*.tf"

        $terraform = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

        if (!(Test-Path -LiteralPath $terraform)) {
            Write-Error "Terraform executable not found."
            exit 1
        }

        & $terraform version

        Write-Host ""
        Write-Host "Running Terraform Init..."

        & $terraform init `
          "-backend-config=storage_account_name=sitterraformstate2026" `
          "-backend-config=container_name=tfstate" `
          "-backend-config=key=sit.terraform.tfstate" `
          "-backend-config=resource_group_name=sit" `
          "-backend-config=subscription_id=6670366d-32db-4180-a842-1ce1053317b7" `
          "-backend-config=use_azuread_auth=true"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "Terraform Init SUCCESS"

      displayName: 'Terraform Init'

    # ========================================================
    # TERRAFORM VALIDATE
    # ========================================================

    - powershell: |

        Write-Host "========================================"
        Write-Host "Terraform Validate"
        Write-Host "========================================"

        Set-Location "$(TerraformRoot)"

        Write-Host "Current directory:"
        Get-Location

        $terraform = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

        if (!(Test-Path -LiteralPath $terraform)) {
            Write-Error "Terraform executable not found."
            exit 1
        }

        & $terraform validate

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform validation failed."
            exit $LASTEXITCODE
        }

        Write-Host ""
        Write-Host "Terraform Validate SUCCESS"

      displayName: 'Terraform Validate'


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan'

  dependsOn: Security_Validation

  condition: succeeded()

  jobs:

  - job: Plan
    displayName: 'Terraform Plan'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      clean: true

    # --------------------------------------------------------
    # FIND TERRAFORM ROOT
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "Finding Terraform Root"
        Write-Host "========================================"

        $source = "$(Build.SourcesDirectory)"

        $mainFiles = Get-ChildItem `
          -Path $source `
          -Recurse `
          -Filter "main.tf" `
          -File `
          -ErrorAction SilentlyContinue

        if ($mainFiles.Count -eq 0) {
            Write-Error "main.tf was not found."
            exit 1
        }

        $terraformRoot = $null

        foreach ($file in $mainFiles) {

            $dir = $file.Directory.FullName

            if (Test-Path -LiteralPath (Join-Path $dir "provider.tf")) {
                $terraformRoot = $dir
                break
            }
        }

        if ([string]::IsNullOrWhiteSpace($terraformRoot)) {
            Write-Error "Terraform root could not be identified."
            exit 1
        }

        Write-Host "Terraform Root:"
        Write-Host $terraformRoot

        Get-ChildItem $terraformRoot -Filter "*.tf"

        Write-Host "##vso[task.setvariable variable=TerraformRoot]$terraformRoot"

      displayName: 'Find Terraform Root'

    # --------------------------------------------------------
    # TERRAFORM INSTALL
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform 1.16.5'
      inputs:
        terraformVersion: '1.16.5'

    # --------------------------------------------------------
    # AZURE LOGIN + TERRAFORM INIT + PLAN
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init and Plan'
      inputs:
        azureSubscription: 'shailesh'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "========================================"
          Write-Host "Azure Account"
          Write-Host "========================================"

          az account show

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Terraform Root"
          Write-Host "========================================"

          Write-Host "$(TerraformRoot)"

          Set-Location "$(TerraformRoot)"

          Write-Host ""
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Terraform files:"
          Get-ChildItem -Filter "*.tf"

          $terraform = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

          if (!(Test-Path -LiteralPath $terraform)) {
              Write-Error "Terraform executable not found."
              exit 1
          }

          & $terraform version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Terraform Init"
          Write-Host "========================================"

          & $terraform init `
            "-backend-config=storage_account_name=sitterraformstate2026" `
            "-backend-config=container_name=tfstate" `
            "-backend-config=key=sit.terraform.tfstate" `
            "-backend-config=resource_group_name=sit" `
            "-backend-config=subscription_id=6670366d-32db-4180-a842-1ce1053317b7" `
            "-backend-config=use_azuread_auth=true"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Terraform init failed."
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Terraform Plan"
          Write-Host "========================================"

          $env:ARM_USE_CLI = "true"

          $planFile = "$(Build.ArtifactStagingDirectory)\terraform.tfplan"

          & $terraform plan `
            -out="$planFile"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Terraform plan failed."
              exit $LASTEXITCODE
          }

          if (!(Test-Path -LiteralPath $planFile)) {
              Write-Error "Terraform plan file was not created."
              exit 1
          }

          Write-Host ""
          Write-Host "Terraform Plan SUCCESS"
          Write-Host "Plan file:"
          Write-Host $planFile

    # --------------------------------------------------------
    # PUBLISH PLAN
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\terraform.tfplan'
        artifact: 'terraform-plan'


# ============================================================
# STAGE 3 - TERRAFORM APPLY
# ============================================================

- stage: Terraform_Apply
  displayName: 'Terraform Apply'

  dependsOn: Terraform_Plan

  condition: succeeded()

  jobs:

  - deployment: Apply
    displayName: 'Terraform Apply'

    environment: 'terraform-production'

    strategy:

      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # CHECKOUT
          # --------------------------------------------------

          - checkout: self
            clean: true

          # --------------------------------------------------
          # FIND TERRAFORM ROOT
          # --------------------------------------------------

          - powershell: |

              Write-Host "========================================"
              Write-Host "Finding Terraform Root"
              Write-Host "========================================"

              $source = "$(Build.SourcesDirectory)"

              $mainFiles = Get-ChildItem `
                -Path $source `
                -Recurse `
                -Filter "main.tf" `
                -File `
                -ErrorAction SilentlyContinue

              if ($mainFiles.Count -eq 0) {
                  Write-Error "main.tf was not found."
                  exit 1
              }

              $terraformRoot = $null

              foreach ($file in $mainFiles) {

                  $dir = $file.Directory.FullName

                  if (Test-Path -LiteralPath (Join-Path $dir "provider.tf")) {
                      $terraformRoot = $dir
                      break
                  }
              }

              if ([string]::IsNullOrWhiteSpace($terraformRoot)) {
                  Write-Error "Terraform root could not be identified."
                  exit 1
              }

              Write-Host "Terraform Root:"
              Write-Host $terraformRoot

              Get-ChildItem $terraformRoot -Filter "*.tf"

              Write-Host "##vso[task.setvariable variable=TerraformRoot]$terraformRoot"

            displayName: 'Find Terraform Root'

          # --------------------------------------------------
          # TERRAFORM INSTALL
          # --------------------------------------------------

          - task: TerraformInstaller@1
            displayName: 'Install Terraform 1.16.5'
            inputs:
              terraformVersion: '1.16.5'

          # --------------------------------------------------
          # DOWNLOAD PLAN
          # --------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)\terraform-plan'

          # --------------------------------------------------
          # CHECK PLAN FILE
          # --------------------------------------------------

          - powershell: |

              Write-Host "========================================"
              Write-Host "Checking Terraform Plan"
              Write-Host "========================================"

              $planFile = "$(Pipeline.Workspace)\terraform-plan\terraform.tfplan"

              if (!(Test-Path -LiteralPath $planFile)) {
                  Write-Error "Terraform plan file not found:"
                  Write-Error $planFile
                  exit 1
              }

              Write-Host "Terraform plan found:"
              Write-Host $planFile

            displayName: 'Verify Terraform Plan'

          # --------------------------------------------------
          # AZURE LOGIN + TERRAFORM INIT + APPLY
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: 'shailesh'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |

                Write-Host "========================================"
                Write-Host "Azure Account"
                Write-Host "========================================"

                az account show

                Write-Host ""
                Write-Host "========================================"
                Write-Host "Terraform Root"
                Write-Host "========================================"

                Write-Host "$(TerraformRoot)"

                Set-Location "$(TerraformRoot)"

                Write-Host ""
                Write-Host "Current directory:"
                Get-Location

                Write-Host ""
                Write-Host "Terraform files:"
                Get-ChildItem -Filter "*.tf"

                $terraform = "$(Agent.ToolsDirectory)\terraform\1.16.5\x64\terraform.exe"

                if (!(Test-Path -LiteralPath $terraform)) {
                    Write-Error "Terraform executable not found."
                    exit 1
                }

                & $terraform version

                Write-Host ""
                Write-Host "========================================"
                Write-Host "Terraform Init"
                Write-Host "========================================"

                & $terraform init `
                  "-backend-config=storage_account_name=sitterraformstate2026" `
                  "-backend-config=container_name=tfstate" `
                  "-backend-config=key=sit.terraform.tfstate" `
                  "-backend-config=resource_group_name=sit" `
                  "-backend-config=subscription_id=6670366d-32db-4180-a842-1ce1053317b7" `
                  "-backend-config=use_azuread_auth=true"

                if ($LASTEXITCODE -ne 0) {
                    Write-Error "Terraform init failed."
                    exit $LASTEXITCODE
                }

                Write-Host ""
                Write-Host "========================================"
                Write-Host "Terraform Apply"
                Write-Host "========================================"

                $env:ARM_USE_CLI = "true"

                $planFile = "$(Pipeline.Workspace)\terraform-plan\terraform.tfplan"

                if (!(Test-Path -LiteralPath $planFile)) {
                    Write-Error "Terraform plan file not found."
                    exit 1
                }

                & $terraform apply `
                  "$planFile"

                if ($LASTEXITCODE -ne 0) {
                    Write-Error "Terraform apply failed."
                    exit $LASTEXITCODE
                }

                Write-Host ""
                Write-Host "========================================"
                Write-Host "TERRAFORM APPLY SUCCESS"
                Write-Host "========================================"