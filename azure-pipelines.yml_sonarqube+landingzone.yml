trigger:
- main

pool:
  name: Azurecicd

variables:
- group: dev

stages:

# =========================================================
# STAGE 1: TERRAFORM VALIDATE + PLAN + SONARQUBE
# =========================================================

- stage: Validate_Plan_SonarQube
  displayName: 'Terraform Validate, Plan & SonarQube'

  jobs:

  - job: Terraform_SonarQube
    displayName: 'Terraform + SonarQube'

    steps:

    # -----------------------------------------------------
    # CHECKOUT
    # -----------------------------------------------------

    - checkout: self

    # -----------------------------------------------------
    # TERRAFORM INSTALLER
    # -----------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.16.4'

    # -----------------------------------------------------
    # TERRAFORM INIT
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

    # -----------------------------------------------------
    # TERRAFORM VALIDATE
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'

    # -----------------------------------------------------
    # TERRAFORM PLAN
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'
        environmentServiceNameAzureRM: 'shailesh'
        commandOptions: '-out=tfplan'

    # -----------------------------------------------------
    # SONARQUBE PREPARE
    # -----------------------------------------------------

    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'sonarqube-connection'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'azure-terraform'
        cliProjectName: 'Azure Terraform'
        cliSources: 'parent_module'

    # -----------------------------------------------------
    # SONARQUBE ANALYZE
    # -----------------------------------------------------

    - task: SonarQubeAnalyze@7
      displayName: 'Run SonarQube Analysis'

    # -----------------------------------------------------
    # SONARQUBE QUALITY GATE
    # -----------------------------------------------------

    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'


# =========================================================
# STAGE 2: TERRAFORM APPLY
# =========================================================

- stage: Terraform_Apply
  displayName: 'Terraform Apply'
  dependsOn: Validate_Plan_SonarQube
  condition: succeeded()

  jobs:

  - deployment: TerraformApply
    displayName: 'Terraform Apply'
    environment: 'terraform-production'

    strategy:
      runOnce:
        deploy:

          steps:

          # ------------------------------------------------
          # CHECKOUT
          # ------------------------------------------------

          - checkout: self

          # ------------------------------------------------
          # TERRAFORM INSTALLER
          # ------------------------------------------------

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '1.16.4'

          # ------------------------------------------------
          # TERRAFORM INIT
          # ------------------------------------------------

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'
              backendServiceArm: 'shailesh'
              backendAzureRmResourceGroupName: 'sit'
              backendAzureRmStorageAccountName: 'sitterraformstate2026'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'sit.terraform.tfstate'

          # ------------------------------------------------
          # TERRAFORM APPLY
          # ------------------------------------------------

          - task: TerraformTask@5
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module'
              environmentServiceNameAzureRM: 'shailesh'
              commandOptions: '-auto-approve'
