# ============================================================
# TERRAFORM LANDING ZONE CI/CD PIPELINE
# DEBUG - AZURE DEVOPS CHECKOUT
# ============================================================

trigger:
- main

pool:
  name: Azurecicd

variables:
- group: dev

stages:

- stage: Debug
  displayName: 'Debug Repository'

  jobs:

  - job: DebugJob
    displayName: 'Check Azure DevOps Checkout'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      clean: true

    # --------------------------------------------------------
    # DEBUG REPOSITORY
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "AZURE DEVOPS CHECKOUT DEBUG"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "Build.SourcesDirectory:"
        Write-Host "$(Build.SourcesDirectory)"

        Write-Host ""
        Write-Host "Build.Repository.Name:"
        Write-Host "$(Build.Repository.Name)"

        Write-Host ""
        Write-Host "Build.SourceBranch:"
        Write-Host "$(Build.SourceBranch)"

        Write-Host ""
        Write-Host "========================================"
        Write-Host "ROOT DIRECTORY CONTENT"
        Write-Host "========================================"

        Get-ChildItem "$(Build.SourcesDirectory)" -Force |
          Format-Table Mode, Length, Name

        Write-Host ""
        Write-Host "========================================"
        Write-Host "ALL FILES IN CHECKOUT"
        Write-Host "========================================"

        Get-ChildItem `
          "$(Build.SourcesDirectory)" `
          -Recurse `
          -File `
          -ErrorAction SilentlyContinue |
          Select-Object FullName

        Write-Host ""
        Write-Host "========================================"
        Write-Host "TERRAFORM FILE SEARCH"
        Write-Host "========================================"

        $tfFiles = Get-ChildItem `
          "$(Build.SourcesDirectory)" `
          -Recurse `
          -Filter "*.tf" `
          -File `
          -ErrorAction SilentlyContinue

        if ($tfFiles.Count -eq 0) {

          Write-Host "NO TERRAFORM FILES FOUND."

        }
        else {

          Write-Host "Terraform files found:"

          $tfFiles |
            Select-Object FullName
        }

      displayName: 'DEBUG - Azure DevOps Checkout'