trigger:
- main

pool:
  name: Azurecicd

steps:

# 1. Clean workspace
- powershell: |
    Write-Host "Cleaning workspace..."

    if (Test-Path "$(Build.SourcesDirectory)") {
        Get-ChildItem "$(Build.SourcesDirectory)" -Force |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
    }

    Write-Host "Workspace cleaned."
  displayName: 'Clean Workspace'

# 2. Clone StreamFlix
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Cloning StreamFlix..."

    git clone --branch main --single-branch https://github.com/sidharth132/StreamFlix.git .

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Git clone failed"
        exit 1
    }

    Write-Host "StreamFlix cloned successfully."
  displayName: 'Clone StreamFlix'

# 3. Verify files
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Repository files:"
    Get-ChildItem -Force

    if (-not (Test-Path "$(Build.SourcesDirectory)\package.json")) {
        Write-Error "package.json NOT FOUND"
        exit 1
    }

    Write-Host "package.json FOUND"
  displayName: 'Verify StreamFlix Files'

# 4. Use existing Node.js
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Node version:"
    node --version

    Write-Host "npm version:"
    npm.cmd --version

    Write-Host "Node location:"
    where.exe node

    Write-Host "npm location:"
    where.exe npm
  displayName: 'Check Existing Node.js'

- powershell: |
    $ErrorActionPreference = "Continue"

    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "====================================="
    Write-Host "Node"
    Write-Host "====================================="
    & "D:\NodeJS\node.exe" --version

    Write-Host "====================================="
    Write-Host "NPM"
    Write-Host "====================================="
    & "D:\NodeJS\npm.cmd" --version

    Write-Host "====================================="
    Write-Host "NPM CACHE"
    Write-Host "====================================="

    New-Item -ItemType Directory -Force -Path "D:\npm-cache" | Out-Null
    New-Item -ItemType Directory -Force -Path "D:\npm-cache\temp" | Out-Null

    $env:TEMP = "D:\npm-cache\temp"
    $env:TMP  = "D:\npm-cache\temp"

    & "D:\NodeJS\npm.cmd" config set cache "D:\npm-cache"

    & "D:\NodeJS\npm.cmd" config get cache

    Write-Host "====================================="
    Write-Host "PACKAGE.JSON"
    Write-Host "====================================="

    Get-Content "$(Build.SourcesDirectory)\package.json"

    Write-Host "====================================="
    Write-Host "NPM INSTALL"
    Write-Host "====================================="

    & "D:\NodeJS\npm.cmd" install --verbose

    Write-Host "====================================="
    Write-Host "NPM EXIT CODE: $LASTEXITCODE"
    Write-Host "====================================="

    exit $LASTEXITCODE
  displayName: 'Install Dependencies'

# 6. Build StreamFlix
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Building StreamFlix..."

    npm.cmd run build

    if ($LASTEXITCODE -ne 0) {
        Write-Error "StreamFlix build failed"
        exit 1
    }

    Write-Host "Build completed successfully."
  displayName: 'Build StreamFlix'
# 7. Verify dist
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    if (-not (Test-Path "$(Build.SourcesDirectory)\dist")) {
        Write-Error "dist folder NOT FOUND"
        exit 1
    }

    Write-Host "dist folder FOUND"

    Get-ChildItem "$(Build.SourcesDirectory)\dist" -Recurse
  displayName: 'Verify Build Output'

# 8. Publish artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish StreamFlix Artifact'
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)\dist'
    ArtifactName: 'streamflix-dist'
    publishLocation: 'Container'