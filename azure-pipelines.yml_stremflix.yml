trigger:
- main

pool:
  name: Azurecicd

steps:

# 1. Clean Azure DevOps workspace
- powershell: |
    Write-Host "Cleaning workspace..."

    if (Test-Path "$(Build.SourcesDirectory)") {
        Get-ChildItem "$(Build.SourcesDirectory)" -Force |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
    }

    Write-Host "Workspace cleaned."
  displayName: 'Clean Workspace'

# 2. Clone StreamFlix from GitHub
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Cloning StreamFlix..."
    
    git clone --branch main --single-branch https://github.com/sidharth132/StreamFlix.git .

    if ($LASTEXITCODE -ne 0) {
        Write-Error "Git clone failed"
        exit 1
    }

    Write-Host "StreamFlix cloned successfully."
  displayName: 'Clone StreamFlix'

# 3. Verify repository
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "====================================="
    Write-Host "Repository files:"
    Write-Host "====================================="

    Get-ChildItem -Force

    Write-Host ""
    Write-Host "Checking package.json..."

    if (-not (Test-Path "$(Build.SourcesDirectory)\package.json")) {
        Write-Error "package.json NOT FOUND"
        exit 1
    }

    Write-Host "package.json FOUND"
  displayName: 'Verify StreamFlix Files'

# 4. Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '20.x'

# 5. Check Node and npm
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Node version:"
    node --version

    Write-Host "npm version:"
    npm.cmd --version
  displayName: 'Check Node.js and npm'

# 6. Install dependencies
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Installing dependencies..."

    npm.cmd install

    if ($LASTEXITCODE -ne 0) {
        Write-Error "npm install failed"
        exit 1
    }

    Write-Host "Dependencies installed successfully."
  displayName: 'Install Dependencies'

# 7. Build StreamFlix
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    Write-Host "Building StreamFlix..."

    npm.cmd run build

    if ($LASTEXITCODE -ne 0) {
        Write-Error "StreamFlix build failed"
        exit 1
    }

    Write-Host "Build completed successfully."
  displayName: 'Build StreamFlix'

# 8. Verify dist
- powershell: |
    Set-Location "$(Build.SourcesDirectory)"

    if (-not (Test-Path "$(Build.SourcesDirectory)\dist")) {
        Write-Error "dist folder NOT FOUND"
        exit 1
    }

    Write-Host "====================================="
    Write-Host "dist folder FOUND"
    Write-Host "====================================="

    Get-ChildItem "$(Build.SourcesDirectory)\dist" -Recurse
  displayName: 'Verify Build Output'

# 9. Publish artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish StreamFlix Artifact'
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)\dist'
    ArtifactName: 'streamflix-dist'
    publishLocation: 'Container'