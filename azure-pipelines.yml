trigger:
  branches:
    include:
      - main

pool:
  name: Azurecicd

stages:

- stage: Terraform_Init
  displayName: 'Terraform_Init'

  jobs:

  - job: TerraformInit_Job
    displayName: 'Terraform Init Job'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
         terraformVersion: '1.16.5'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'

- stage: terraform_plan
  displayName: 'Terraform plan'

  jobs:

  - job: Terraform_plan
    displayName: 'Terraform plan'

    steps:

    - checkout: self
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/parent_module/dev'
        backendServiceArm: 'shailesh'
        backendAzureRmResourceGroupName: 'sit'
        backendAzureRmStorageAccountName: 'sitterraformstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sit.terraform.tfstate'
    - task: TerraformTask@5
      inputs:
       provider: 'azurerm'
       command: 'plan'
       environmentServiceNameAzureRM: 'shailesh'